[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# determinator's API takes guppy's PackageGraph, so guppy must stay on the
# version determinator is built against (0.19 for determinator 0.13).
determinator = "0.13.0"
globset = { workspace = true }
guppy = "0.19"
serde = { workspace = true }
toml = "1.1"
dirs = { workspace = true }
serde_json = { workspace = true }
