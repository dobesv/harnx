[package]
name = "harnx-mcp-remote"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "stdio MCP proxy that forwards to remote HTTP MCP servers"

[lib]
name = "harnx_mcp_remote"
path = "src/lib.rs"

[dependencies]
harnx-nats-common = { workspace = true }
harnx-core = { path = "../harnx-core" }
harnx-credentials = { path = "../harnx-credentials" }
harnx-healthz = { workspace = true }
harnx-metrics = { workspace = true }
harnx-telemetry = { workspace = true, features = ["mcp"] }
harnx-toolset = { path = "../harnx-toolset" }
harnx-toolset-server = { path = "../harnx-toolset-server" }
log = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
oauth2 = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
ipnet = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "harnx-mcp-remote"
path = "src/main.rs"

[dev-dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
harnx-core = { path = "../harnx-core" }
harnx-credentials = { path = "../harnx-credentials" }
harnx-nats-common = { workspace = true }
harnx-test-bins = { path = "../harnx-test-bins" }
harnx-toolset = { path = "../harnx-toolset" }
harnx-toolset-server = { path = "../harnx-toolset-server" }
log = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
