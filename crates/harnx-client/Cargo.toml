[package]
name = "harnx-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM provider clients (OpenAI, Claude, Gemini, Bedrock, Vertex, Cohere, Azure, OpenAI-compatible) for harnx"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-eventstream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
harnx-core = { path = "../harnx-core" }
harnx-telemetry = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
path-absolutize = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-stream = { workspace = true }
urlencoding = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
hyperlocal = { workspace = true }

[dev-dependencies]
harnx-test-bins = { path = "../harnx-test-bins" }
rand = "0.10.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
