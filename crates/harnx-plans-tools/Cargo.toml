[package]
name = "harnx-plans-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NATS-backed plan/task/note toolset server"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
harnx-blob-store = { path = "../harnx-blob-store" }
harnx-core = { path = "../harnx-core" }
harnx-nats-common = { workspace = true }
harnx-toolset = { path = "../harnx-toolset" }
harnx-toolset-server = { path = "../harnx-toolset-server" }
log = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }

[dev-dependencies]
harnx-test-bins = { path = "../harnx-test-bins" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "harnx-plans-tools"
path = "src/main.rs"
