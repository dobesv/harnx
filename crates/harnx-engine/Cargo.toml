[package]
name = "harnx-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified LLM + tool-call loop for harnx, emitting AgentEvent streams consumed by every front-end (TUI, CLI, and HTTP)"

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
harnx-client = { path = "../harnx-client" }
harnx-core = { path = "../harnx-core" }
harnx-render = { path = "../harnx-render" }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
harnx-runtime = { path = "../harnx-runtime" }
tokio = { workspace = true, features = ["test-util"] }
