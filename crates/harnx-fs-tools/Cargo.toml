[package]
name = "harnx-fs-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Toolset server that exposes filesystem operations with safety guards (also supports MCP stdio via --mcp-stdio)"

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
fancy-regex = { workspace = true }
gix = { workspace = true }
glob = { workspace = true }
harnx-blob-store = { path = "../harnx-blob-store" }
harnx-core = { path = "../harnx-core" }
harnx-git-history = { workspace = true }
harnx-tool-allow = { path = "../harnx-tool-allow" }
harnx-toolset = { path = "../harnx-toolset" }
harnx-toolset-server = { path = "../harnx-toolset-server" }
log = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true }

[dev-dependencies]
harnx-test-bins = { path = "../harnx-test-bins" }
reqwest = { workspace = true }
rmcp = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }
which = { workspace = true }

[[bin]]
name = "harnx-fs-tools"
path = "src/main.rs"
