[package]
name = "harnx-mcp-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing harnx tools and agents-as-tools over stdio or Streamable HTTP"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
harnx-core = { path = "../harnx-core" }
harnx-runtime = { path = "../harnx-runtime" }
parking_lot = { workspace = true }
rmcp = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[dev-dependencies]
reqwest = { workspace = true }
assert_cmd = "2"
async-nats = { workspace = true }
harnx-healthz = { path = "../harnx-healthz" }
harnx-test-bins = { path = "../harnx-test-bins" }
harnx-toolset = { path = "../harnx-toolset" }
harnx-toolset-server = { path = "../harnx-toolset-server" }
predicates = "3"
tempfile = { workspace = true }

[[bin]]
name = "harnx-mcp-server"
path = "src/main.rs"
