# NATS 2.11.6 sandbox permission profile. See docs/a2a-operations.md.
#
# Authentication and authorization configuration defining service
# permission boundaries for:
# 1. Unrestricted admin (sandbox test harness and cluster setup)
# 2. A2A Backend Service (harnx-a2a-server replicas)
# 3. Worker Daemon (harnx-worker instances)

# Unrestricted admin user for sandbox harness / management connection
no_auth_user: admin

authorization {
  users: [
    # Admin principal with unrestricted permissions
    {
      user: admin
    },

    # A2A Backend principal (harnx-a2a-server)
    # Serves public A2A JSON-RPC and SSE requests.
    # Manages context authority, task index, outbox publishing, and activation dispatch.
    # Application must not acquire worker execution leases. Work queue consumers are denied.
    {
      user: a2a_backend,
      password: "a2a_backend_test_password",
      permissions: {
        publish: {
          allow: [
            # JetStream server information probe
            "$JS.API.INFO",

            # Stream provisioning, update, info, leader message get, and purge (NO DELETE)
            "$JS.API.STREAM.CREATE.*",
            "$JS.API.STREAM.UPDATE.*",
            "$JS.API.STREAM.INFO.*",
            "$JS.API.STREAM.MSG.GET.*",
            "$JS.API.STREAM.PURGE.*",
            "$JS.API.DIRECT.GET.>",

            # Ephemeral consumer creation on KV streams for keys() / watch() iteration
            "$JS.API.CONSUMER.*.KV_harnx_sessions",
            "$JS.API.CONSUMER.*.KV_harnx_sessions.>",
            "$JS.API.CONSUMER.*.KV_harnx_leases",
            "$JS.API.CONSUMER.*.KV_harnx_leases.>",

            # JetStream message acknowledgements
            "$JS.ACK.>",

            # Committed A2A task events outbox (a2a.tasks.{storage_key}.{task_uuid})
            "a2a.tasks.>",

            # KV bucket harnx_sessions (context, index, tasks, reservations, registry)
            "$KV.harnx_sessions.>",

            # KV bucket harnx_leases (for scoped A2A leases)
            "$KV.harnx_leases.>",

            # Cluster session activation dispatch to worker queue (WORK_NOTIFY_<cluster>)
            "cluster.*.sessions.notify",

            # Fixed ticket admission prompt append and non-executable closure append
            "sessions.*.log",
            "harnx.session.*.metadata.invalidated",
            "harnx.session.*.read.invalidated"
          ]
        },
        subscribe: {
          allow: [
            # Client request-reply ephemeral inboxes
            "_INBOX.>",

            # Watches on context transitions and task completions
            "$KV.harnx_sessions.>",

            # Watches on A2A scoped lease loss events
            "$KV.harnx_leases.>"
          ]
        }
      }
    },

    # Worker Daemon principal (harnx-worker)
    # Leases sessions for execution, runs LLM agent turns, invokes tools.
    # KV keys contain slashes within one subject token; fine-grained path ACLs are not possible.
    {
      user: worker,
      password: "worker_test_password",
      permissions: {
        publish: {
          allow: [
            # JetStream server information probe
            "$JS.API.INFO",

            # Work queue pull consumer API
            "$JS.API.CONSUMER.>",

            # Stream lifecycle (including DELETE for session GC)
            "$JS.API.STREAM.CREATE.*",
            "$JS.API.STREAM.UPDATE.*",
            "$JS.API.STREAM.INFO.*",
            "$JS.API.STREAM.MSG.GET.*",
            "$JS.API.STREAM.DELETE.*",
            "$JS.API.STREAM.PURGE.*",
            "$JS.API.DIRECT.GET.>",

            # JetStream message acknowledgements
            "$JS.ACK.>",

            # Session transcript appends during turn execution
            "sessions.*.log",
            "harnx.session.*.metadata.invalidated",
            "harnx.session.*.read.invalidated",

            # Worker execution lease
            "$KV.harnx_leases.>",

            # Canonical session metadata updates and prefix purges
            "$KV.harnx_sessions.>",

            # Tool registry and hook storage
            "$KV.harnx_tool_registry.>",
            "$KV.harnx_hook_*.>",

            # Object store for attachments and plans
            "$O.harnx_attachments.>",
            "$KV.harnx_plans.>"
          ]
        },
        subscribe: {
          allow: [
            # Worker request-reply ephemeral inboxes
            "_INBOX.>",

            # Worker execution lease renewal and lost-watch events
            "$KV.harnx_leases.>",

            # Hook expectations
            "$KV.harnx_hook_expectations.>"
          ]
        }
      }
    }
  ]
}
