[package]
name = "harnx-telemetry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenTelemetry tracing initialization for harnx services"

[features]
default = []
nats = ["dep:async-nats"]
mcp = ["dep:rmcp"]
testing = ["opentelemetry_sdk/testing"]

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true, optional = true }
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true, default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio"] }
reqwest = { workspace = true }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, default-features = false, features = ["registry", "env-filter"] }

[dev-dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
harnx-client = { path = "../harnx-client" }
harnx-core = { path = "../harnx-core" }
harnx-engine = { path = "../harnx-engine" }
opentelemetry-proto = { workspace = true, default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
rmcp = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }

[[test]]
name = "tracing_e2e"
required-features = ["nats", "mcp", "testing"]
