# Exact pytest node IDs, including class and JSON-RPC parameter, keep scope narrow.
# Remove an entry when its test passes; strict xfail makes unexpected passes fail CI.

[[waiver]]
test = "tests/compatibility/core_operations/test_artifacts.py::TestTextArtifact::test_task_has_text_artifact[jsonrpc]"
category = "harness-limitation"
reason = "The test requires the exact text 'Generated text content' selected by messageId. The real worker uses a deterministic LLM that returns 'Hello world' and does not receive messageId as model input."

