[workspace]
resolver = "2"
members = [
    "crates/harnx",
    "crates/harnx-client",
    "crates/harnx-core",
    "crates/harnx-engine",
    "crates/harnx-acp",
    "crates/harnx-acp-server",
    "crates/harnx-session",
    "crates/harnx-aws-creds",
    "crates/harnx-k8s-creds",
    "crates/harnx-fetch",
    "crates/harnx-hooks",
    "crates/harnx-mcp",
    "crates/harnx-mcp-bash",
    "crates/harnx-sandbox-common",
    "crates/harnx-sandbox-run",
    "crates/harnx-mcp-hooks-proxy",
    "crates/harnx-mcp-fs",
    "crates/harnx-mcp-time",
    "crates/harnx-mcp-remote",
    "crates/harnx-mcp-plans",
    "crates/harnx-mcp-plans-core",
    "crates/harnx-mcp-plans-github",
    "crates/harnx-mcp-history",
    "crates/harnx-pkg",
    "crates/harnx-rag",
    "crates/harnx-render",
    "crates/harnx-runtime",
    "crates/harnx-serve",
    "crates/harnx-spinner",
    "crates/harnx-test-bins",
    "crates/harnx-tui",
    "crates/harnx-proxy-auth",
    "crates/ratatui-widget-scrolling",
    "xtask",
]

[workspace.package]
version = "0.33.4"
edition = "2021"
authors = ["sigoden <sigoden@gmail.com>"]
description = "All-in-one LLM CLI Tool"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dobesv/harnx"
repository = "https://github.com/dobesv/harnx"
categories = ["command-line-utilities"]
keywords = ["chatgpt", "llm", "cli", "ai", "tui"]

[profile.release]
lto = true
# Keep symbols and line tables (don't strip) so crash backtraces in released
# binaries — notably the heap-guard abort trace and panic backtraces — resolve
# to real function names and file:line instead of `<unknown>`. Line-tables-only
# keeps the added size modest, and opt-level = "z" still minimises the code.
strip = false
debug = "line-tables-only"
opt-level = "z"

[workspace.dependencies]
anyhow = "1.0.69"
bytes = "1.4.0"
axum = "0.8"
clap = { version = "4.4.8", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.29"
inquire = "0.9.0"
is-terminal = "0.4.9"
ratatui = { version = "0.30.1", features = ["crossterm_0_29", "unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.93", features = ["preserve_order"] }
serde_yaml = "0.9.17"
tokio = { version = "1.48", features = ["rt", "time", "macros", "signal", "rt-multi-thread", "io-util", "process"] }
tokio-graceful = "0.2.2"
tokio-stream = { version = "0.1.15", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5" }
crossterm = "0.29"
chrono = { version = "0.4.23", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
bincode = { version = "2.0.1", features = ["serde", "std"], default-features = false }
parking_lot = "0.12.1"
fancy-regex = "0.18.0"
base64 = "0.22.0"
nu-ansi-term = "0.50.0"
async-trait = "0.1.74"
birdcage = "0.8"
textwrap = "0.16.0"
ansi_colours = "1.2.2"
reqwest-eventsource = { git = "https://github.com/jpopesculian/reqwest-eventsource", rev = "356e2f61827b193bd5ab389c38059bcc2eed90aa" }
simplelog = "0.12.1"
log = "0.4.20"
gix = { version = "0.85.0", features = ["blob-diff", "worktree-mutation", "tree-editor", "blocking-network-client"] }
oci-client = "0.17"
semver = { version = "1.0", features = ["serde"] }
mockall = "0.15"
wiremock = "0.6"
registry-testkit = "0.1"
shell-words = "1.1.0"
sha2 = "0.11.0"
unicode-width = "0.2.0"
async-recursion = "1.1.1"
http = "1.1.0"
http-body = "1"
http-body-util = "0.1"
multer = "3"
hudsucker = { version = "0.25.0", features = ["rcgen-ca"] }
hyper = { version = "1.0", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["aws-lc-rs", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy"] }
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }
moka = { version = "0.12", features = ["sync"] }
rcgen = "0.14"
rustls-pemfile = "2"
tokio-rustls = "0.26"
time = { version = "0.3.36", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jaq-all = { version = "0.2", features = ["formats"] }
indexmap = { version = "2.2.6", features = ["serde"] }
hmac = "0.13.0"
aws-config = { version = "1", features = ["sso"] }
aws-credential-types = "1"
aws-smithy-eventstream = "0.61.0"
kube = { version = "4.0.0", features = ["client", "config"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
secrecy = { version = "0.10" }
urlencoding = "2.1.3"
unicode-segmentation = "1.11.0"
bitflags = "2.5.0"
path-absolutize = "4.0.0"
hnsw_rs = "0.3.0"
rayon = "1.10.0"
uuid = { version = "1.9.1", features = ["v4", "v7"] }
scraper = { version = "0.27.0", default-features = false, features = ["deterministic"] }
tempfile = "3"
sys-locale = "0.3.1"
html_to_markdown = "0.1.0"
os_info = { version = "3.8.2", default-features = false }
bm25 = { version = "2.0.1", features = ["parallelism"] }
which = "8.0.0"
fuzzy-matcher = "0.3.7"
terminal-colorsaurus = "1.0.3"
duct = "1.0.0"
rmcp = { version = "2.0", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
process-wrap = { version = "9", features = ["tokio1"] }
libc = "0.2"
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk", rev = "ce023279824149008659dd8f4b8b70266a7e8210" }
async-nats = { version = "0.50", default-features = false, features = ["server_2_10", "server_2_11", "ring", "jetstream", "kv"] }
glob = "0.3"
globset = "0.4"
shellexpand = "3.1.0"
schemars = "1.0"
ratatui-textarea = "0.9.0"
ratatui_widget_scrolling = "0.1.0"
jiff = { version = "0.2.23", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.0", features = ["json", "multipart", "socks", "rustls", "stream"], default-features = false }
syntect = { version = "5.0.0", features = ["parsing", "regex-onig", "plist-load"], default-features = false }
arboard = { version = "3.3.0", default-features = false }
harnx-acp = { path = "crates/harnx-acp" }
harnx-acp-server = { path = "crates/harnx-acp-server" }
harnx-session = { path = "crates/harnx-session" }
minijinja = { version = "2.21.0", default-features = false, features = ["builtins", "debug", "serde"] }
harnx-mcp-history = { path = "crates/harnx-mcp-history" }
harnx-sandbox-common = { path = "crates/harnx-sandbox-common" }
similar = "3"
jaq-core = "3.0.0"
jaq-std = "3.0.0"
jaq-json = "2.0.0"

[patch.crates-io]
ratatui_widget_scrolling = { path = "crates/ratatui-widget-scrolling" }
