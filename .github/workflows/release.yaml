name: Release

on:
  push:
    tags:
    # Knope tags releases as `harnx/v<version>` (monorepo-style prefix from
    # the [packages.harnx] config). Earlier `v<version>` tag pattern is kept
    # for any manual tags that don't go through knope.
    - 'harnx/v[0-9]+.[0-9]+.[0-9]+*'
    - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to GitHub Release
    permissions:
      contents: write
    outputs:
      rc: ${{ steps.check-tag.outputs.rc }}

    strategy:
      # Surface every target's failure in one run instead of cancelling on
      # the first error. Each platform builds independently, and partial
      # success is still useful to ship.
      fail-fast: false
      matrix:
        include:
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          use-cross: true
          # This target has repeatedly lost its hosted runner during the
          # release build. Bound concurrent compilers and avoid fat LTO's
          # high link-time resource use on the 16 GB runner.
          cargo-flags: "--jobs 2"
        - target: aarch64-apple-darwin
          os: macos-latest
          use-cross: true
          cargo-flags: ""
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          use-cross: true
          cargo-flags: ""
        - target: x86_64-apple-darwin
          os: macos-latest
          cargo-flags: ""
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          cargo-flags: ""
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          use-cross: true
          cargo-flags: ""
        - target: i686-pc-windows-msvc
          os: windows-latest
          use-cross: true
          cargo-flags: ""
        # 32-bit Linux targets (i686-unknown-linux-musl,
        # armv7-unknown-linux-musleabihf, arm-unknown-linux-musleabihf) are
        # intentionally excluded: `birdcage` (used by `harnx-bash-tools` for
        # filesystem sandboxing) references syscall constants that aren't
        # defined in libc for those targets (`SYS_shmget`, `SYS_accept`,
        # `SYS_mmap`, ...), so the build can't currently produce a working
        # set of artifacts. Re-add once birdcage gains support or it's
        # made optional in harnx-bash-tools.

    runs-on: ${{matrix.os}}
    env:
      BUILD_CMD: cargo

    steps:
    - uses: actions/checkout@v7

    - name: Check Tag
      id: check-tag
      shell: bash
      run: |
        ver=${GITHUB_REF##*/}
        echo "version=$ver" >> $GITHUB_OUTPUT
        if [[ "$ver" =~ [0-9]+.[0-9]+.[0-9]+$ ]]; then
          echo "rc=false" >> $GITHUB_OUTPUT
        else
          echo "rc=true" >> $GITHUB_OUTPUT
        fi


    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # rust-toolchain.toml pins the active toolchain to a specific 1.x.y, so
    # `cargo build` ignores the `stable` toolchain dtolnay set up. The target
    # stdlib must be added to the pinned toolchain too. Run unconditionally:
    # cross silently falls back to plain cargo when no Docker image exists
    # for the target (e.g. i686/aarch64-pc-windows-msvc), so the rustup
    # target needs to be present even on `use-cross: true` jobs. When cross
    # does run a real container build, `rustup target add` is a harmless
    # no-op against the host toolchain.
    - name: Install Rust target for pinned toolchain
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Install cross
      if: matrix.use-cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Overwrite build command env variable
      if: matrix.use-cross
      shell: bash
      run: echo "BUILD_CMD=cross" >> $GITHUB_ENV

    - name: Show Version Information (Rust, cargo, GCC)
      shell: bash
      run: |
        gcc --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build
      shell: bash
      run: |
        if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
          export CARGO_PROFILE_RELEASE_LTO=thin
        fi
        $BUILD_CMD build --locked --release --target=${{ matrix.target }} ${{ matrix.cargo-flags }} \
          -p harnx -p harnx-serve -p harnx-worker \
          -p harnx-bash-tools -p harnx-fs-tools -p harnx-grep-tools -p harnx-plans-tools -p harnx-mcp-bridge -p harnx-time-tools \
          -p harnx-aws-creds -p harnx-k8s-creds -p harnx-k8s-sandbox-tools -p harnx-pkg -p harnx-proxy-auth \
          -p harnx-sandbox-run \
          -p harnx-sandbox-common

    - name: Build Archives
      shell: bash
      id: package
      env:
        target: ${{ matrix.target }}
        version:  ${{ steps.check-tag.outputs.version }}
      run: |
        set -euxo pipefail

        dist_dir=`pwd`/dist
        mkdir $dist_dir

        # Each entry is "archive-name:bin1[,bin2...]" — the archive's
        # filename uses archive-name; staged contents are the listed bins.
        # Each binary ships in its own archive; harnx-sandbox-exec is packaged separately.
        archive_specs=(
          "harnx:harnx"
          "harnx-serve:harnx-serve"
          "harnx-worker:harnx-worker"
          "harnx-bash-tools:harnx-bash-tools"
          "harnx-fs-tools:harnx-fs-tools"
          "harnx-grep-tools:harnx-grep-tools"
          "harnx-plans-tools:harnx-plans-tools"
          "harnx-mcp-bridge:harnx-mcp-bridge"
          "harnx-time-tools:harnx-time-tools"
          "harnx-aws-creds:harnx-aws-creds"
          "harnx-k8s-creds:harnx-k8s-creds"
          "harnx-k8s-sandbox-tools:harnx-k8s-sandbox-tools"
          "harnx-pkg:harnx-pkg"
          "harnx-proxy-auth:harnx-proxy-auth"
          "harnx-sandbox-run:harnx-sandbox-run"
          "harnx-sandbox-exec:harnx-sandbox-exec"
        )

        archives=()
        for spec in "${archive_specs[@]}"; do
          archive_base="${spec%%:*}"
          IFS=',' read -ra bins <<< "${spec#*:}"

          name=$archive_base-$version-$target
          staging=$dist_dir/$archive_base-stage
          mkdir $staging

          for bin in "${bins[@]}"; do
            executable=target/$target/release/$bin
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              executable=$executable.exe
            fi
            cp $executable $staging/
          done

          if [[ "$RUNNER_OS" == "Windows" ]]; then
              archive=$dist_dir/$name.zip
              (cd $staging && 7z a $archive *)
              archives+=("dist/$name.zip")
          else
              archive=$dist_dir/$name.tar.gz
              (cd $staging && tar -czf $archive *)
              archives+=("dist/$name.tar.gz")
          fi
        done

        # Emit as a newline-separated list for softprops/action-gh-release.
        printf 'archives<<EOF\n%s\nEOF\n' "$(IFS=$'\n'; echo "${archives[*]}")" >> $GITHUB_OUTPUT

    - name: Publish Archives
      uses: softprops/action-gh-release@v3
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        draft: false
        files: ${{ steps.package.outputs.archives }}
        prerelease: ${{ steps.check-tag.outputs.rc == 'true' }}

  web-assets:
    name: Publish Web UI assets
    runs-on: ubuntu-latest
    # Run after the binary build matrix so web assets attach to the release
    # after the binaries rather than racing them. `always() && !cancelled()`
    # mirrors the docker job and matches the release job's `fail-fast: false`
    # policy (partial success is intentionally shippable), so a single failed
    # target still lets the web assets publish.
    needs: release
    if: always() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # pnpm/Node setup mirrors the existing web-ci.yml / web-e2e.yml
      # workflows (pinned action majors and explicit versions) for consistency.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check Tag
        id: vars
        shell: bash
        run: |
          ver=${GITHUB_REF##*/}
          echo "version=$ver" >> $GITHUB_OUTPUT
          if [[ "$ver" =~ [0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "rc=false" >> $GITHUB_OUTPUT
          else
            echo "rc=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Web UI
        shell: bash
        run: |
          set -euxo pipefail
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage Web UI artifact
        shell: bash
        run: |
          set -euxo pipefail
          cp -a web/dist/. web-assets-dist/
          rm -f web-assets-dist/mockServiceWorker.js
          find web-assets-dist -type f -name '*.map' -delete

      - name: Upload Web UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-assets-dist
          path: web-assets-dist/
          if-no-files-found: error
          include-hidden-files: true

      - name: Package Web UI assets
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euxo pipefail
          tar --exclude='mockServiceWorker.js' --exclude='*.map' -czf "harnx-web-assets-$VERSION.tar.gz" -C web/dist .
          (
            cd web/dist
            zip -r "$OLDPWD/harnx-web-assets-$VERSION.zip" . -x 'mockServiceWorker.js' '*.map'
          )
          # Sanity-check the archives before they are published: both must be
          # non-empty and contain index.html at the root. Fail loudly rather
          # than publish a broken/empty asset bundle.
          test -s "harnx-web-assets-$VERSION.tar.gz"
          test -s "harnx-web-assets-$VERSION.zip"
          tar -tzf "harnx-web-assets-$VERSION.tar.gz" | grep -x './index.html' > /dev/null
          tar -tzf "harnx-web-assets-$VERSION.tar.gz" | grep -E '^\./assets/.*\.js$' > /dev/null
          unzip -Z1 "harnx-web-assets-$VERSION.zip" | grep -Ex '(\./)?index\.html' > /dev/null

      - name: Publish Web UI assets
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          draft: false
          files: |
            harnx-web-assets-${{ steps.vars.outputs.version }}.tar.gz
            harnx-web-assets-${{ steps.vars.outputs.version }}.zip
          prerelease: ${{ steps.vars.outputs.rc == 'true' }}

  docker:
    name: Publish Docker Images
    needs: [release, web-assets]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#harnx/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docker-assets linux-amd64 linux-arm64
          cd docker-assets
          V=${{ steps.version.outputs.version }}
          # Download x86_64 (amd64) archives
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-serve-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-worker-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-bash-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-fs-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-grep-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-plans-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-bridge-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-time-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-aws-creds-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-k8s-creds-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-k8s-sandbox-tools-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-pkg-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-proxy-auth-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-sandbox-run-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-sandbox-exec-$V-x86_64-unknown-linux-musl.tar.gz" || true
          # Download aarch64 (arm64) archives
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-serve-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-worker-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-bash-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-fs-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-grep-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-plans-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-bridge-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-time-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-aws-creds-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-k8s-creds-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-k8s-sandbox-tools-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-pkg-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-proxy-auth-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-sandbox-run-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-sandbox-exec-$V-aarch64-unknown-linux-musl.tar.gz" || true

      - name: Extract archives
        run: |
          cd docker-assets
          for f in *x86_64*.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f" -C ../linux-amd64/
          done
          for f in *aarch64*.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f" -C ../linux-arm64/
          done

      - name: Verify extracted binaries
        run: |
          missing=0
          for dir in linux-amd64 linux-arm64; do
            for bin in harnx harnx-serve harnx-worker harnx-bash-tools harnx-fs-tools harnx-grep-tools harnx-plans-tools harnx-mcp-bridge harnx-time-tools harnx-aws-creds harnx-k8s-creds harnx-k8s-sandbox-tools harnx-pkg harnx-proxy-auth harnx-sandbox-run harnx-sandbox-exec; do
              if [ ! -f "$dir/$bin" ]; then
                echo "ERROR: missing $dir/$bin"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "Some binaries are missing. Check asset download step."; exit 1; }

      - name: Download Web UI artifact
        uses: actions/download-artifact@v8
        with:
          name: web-assets-dist
          path: web-assets/

      - name: Verify Web UI artifact
        run: test -f web-assets/index.html

      - name: Build and push harnx-plans-tools
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx-plans-tools.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx-plans-tools:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx-plans-tools:latest' || '' }}

      - name: Build and push harnx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx:latest' || '' }}

      - name: Build and push harnx-web-assets
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx-web-assets.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx-web-assets:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx-web-assets:latest' || '' }}

  publish-crate:
    name: Publish to crates.io
    # Disabled: not yet ready to publish to crates.io. Re-enable by restoring
    # the original condition: `${{ needs.release.outputs.rc == 'false' }}`.
    if: false
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
