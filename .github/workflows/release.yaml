name: Release

on:
  push:
    tags:
    # Knope tags releases as `harnx/v<version>` (monorepo-style prefix from
    # the [packages.harnx] config). Earlier `v<version>` tag pattern is kept
    # for any manual tags that don't go through knope.
    - 'harnx/v[0-9]+.[0-9]+.[0-9]+*'
    - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    name: Publish to GitHub Release
    permissions:
      contents: write
    outputs:
      rc: ${{ steps.check-tag.outputs.rc }}

    strategy:
      # Surface every target's failure in one run instead of cancelling on
      # the first error. Each platform builds independently, and partial
      # success is still useful to ship.
      fail-fast: false
      matrix:
        include:
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          use-cross: true
          cargo-flags: ""
        - target: aarch64-apple-darwin
          os: macos-latest
          use-cross: true
          cargo-flags: ""
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          use-cross: true
          cargo-flags: ""
        - target: x86_64-apple-darwin
          os: macos-latest
          cargo-flags: ""
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          cargo-flags: ""
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          use-cross: true
          cargo-flags: ""
        - target: i686-pc-windows-msvc
          os: windows-latest
          use-cross: true
          cargo-flags: ""
        # 32-bit Linux targets (i686-unknown-linux-musl,
        # armv7-unknown-linux-musleabihf, arm-unknown-linux-musleabihf) are
        # intentionally excluded: `birdcage` (used by `harnx-mcp-bash` for
        # filesystem sandboxing) references syscall constants that aren't
        # defined in libc for those targets (`SYS_shmget`, `SYS_accept`,
        # `SYS_mmap`, ...), so the build can't currently produce a working
        # set of artifacts. Re-add once birdcage gains support or it's
        # made optional in harnx-mcp-bash.

    runs-on: ${{matrix.os}}
    env:
      BUILD_CMD: cargo

    steps:
    - uses: actions/checkout@v6

    - name: Check Tag
      id: check-tag
      shell: bash
      run: |
        ver=${GITHUB_REF##*/}
        echo "version=$ver" >> $GITHUB_OUTPUT
        if [[ "$ver" =~ [0-9]+.[0-9]+.[0-9]+$ ]]; then
          echo "rc=false" >> $GITHUB_OUTPUT
        else
          echo "rc=true" >> $GITHUB_OUTPUT
        fi


    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # rust-toolchain.toml pins the active toolchain to a specific 1.x.y, so
    # `cargo build` ignores the `stable` toolchain dtolnay set up. The target
    # stdlib must be added to the pinned toolchain too. Run unconditionally:
    # cross silently falls back to plain cargo when no Docker image exists
    # for the target (e.g. i686/aarch64-pc-windows-msvc), so the rustup
    # target needs to be present even on `use-cross: true` jobs. When cross
    # does run a real container build, `rustup target add` is a harmless
    # no-op against the host toolchain.
    - name: Install Rust target for pinned toolchain
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Install cross
      if: matrix.use-cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Overwrite build command env variable
      if: matrix.use-cross
      shell: bash
      run: echo "BUILD_CMD=cross" >> $GITHUB_ENV

    - name: Show Version Information (Rust, cargo, GCC)
      shell: bash
      run: |
        gcc --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build
      shell: bash
      run: |
        $BUILD_CMD build --locked --release --target=${{ matrix.target }} ${{ matrix.cargo-flags }} \
          -p harnx -p harnx-serve -p harnx-acp-server \
          -p harnx-mcp-bash -p harnx-mcp-fs -p harnx-mcp-plans -p harnx-mcp-time \
          -p harnx-aws-creds

    - name: Build Archives
      shell: bash
      id: package
      env:
        target: ${{ matrix.target }}
        version:  ${{ steps.check-tag.outputs.version }}
      run: |
        set -euxo pipefail

        dist_dir=`pwd`/dist
        mkdir $dist_dir

        # Each entry is "archive-name:bin1[,bin2...]" — the archive's
        # filename uses archive-name; staged contents are the listed bins.
        # harnx-mcp-bash ships its sandbox helper alongside the main bin.
        archive_specs=(
          "harnx:harnx"
          "harnx-serve:harnx-serve"
          "harnx-acp-server:harnx-acp-server"
          "harnx-mcp-bash:harnx-mcp-bash,harnx-mcp-bash-sandbox-run"
          "harnx-mcp-fs:harnx-mcp-fs"
          "harnx-mcp-plans:harnx-mcp-plans"
          "harnx-mcp-time:harnx-mcp-time"
          "harnx-aws-creds:harnx-aws-creds"
        )

        archives=()
        for spec in "${archive_specs[@]}"; do
          archive_base="${spec%%:*}"
          IFS=',' read -ra bins <<< "${spec#*:}"

          name=$archive_base-$version-$target
          staging=$dist_dir/$archive_base-stage
          mkdir $staging

          for bin in "${bins[@]}"; do
            executable=target/$target/release/$bin
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              executable=$executable.exe
            fi
            cp $executable $staging/
          done

          if [[ "$RUNNER_OS" == "Windows" ]]; then
              archive=$dist_dir/$name.zip
              (cd $staging && 7z a $archive *)
              archives+=("dist/$name.zip")
          else
              archive=$dist_dir/$name.tar.gz
              (cd $staging && tar -czf $archive *)
              archives+=("dist/$name.tar.gz")
          fi
        done

        # Emit as a newline-separated list for softprops/action-gh-release.
        printf 'archives<<EOF\n%s\nEOF\n' "$(IFS=$'\n'; echo "${archives[*]}")" >> $GITHUB_OUTPUT

    - name: Publish Archives
      uses: softprops/action-gh-release@v3
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        draft: false
        files: ${{ steps.package.outputs.archives }}
        prerelease: ${{ steps.check-tag.outputs.rc == 'true' }}

  docker:
    name: Publish Docker Images
    needs: release
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#harnx/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docker-assets linux-amd64 linux-arm64
          cd docker-assets
          V=${{ steps.version.outputs.version }}
          # Download x86_64 (amd64) archives
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-serve-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-acp-server-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-bash-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-fs-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-plans-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-time-$V-x86_64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-proxy-auth-$V-x86_64-unknown-linux-musl.tar.gz"
          # Download aarch64 (arm64) archives
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-serve-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-acp-server-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-bash-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-fs-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-plans-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-mcp-time-$V-aarch64-unknown-linux-musl.tar.gz" || true
          gh release download "$GITHUB_REF_NAME" \
            --pattern "harnx-proxy-auth-$V-aarch64-unknown-linux-musl.tar.gz"

      - name: Extract archives
        run: |
          cd docker-assets
          for f in *x86_64*.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f" -C ../linux-amd64/
          done
          for f in *aarch64*.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f" -C ../linux-arm64/
          done

      - name: Verify extracted binaries
        run: |
          missing=0
          for dir in linux-amd64 linux-arm64; do
            for bin in harnx harnx-serve harnx-acp-server harnx-mcp-bash harnx-mcp-bash-sandbox-run harnx-mcp-fs harnx-mcp-plans harnx-mcp-time harnx-proxy-auth; do
              if [ ! -f "$dir/$bin" ]; then
                echo "ERROR: missing $dir/$bin"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "Some binaries are missing. Check asset download step."; exit 1; }

      - name: Build and push harnx-mcp-time
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx-mcp-time.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx-mcp-time:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx-mcp-time:latest' || '' }}

      - name: Build and push harnx-mcp-plans
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx-mcp-plans.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx-mcp-plans:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx-mcp-plans:latest' || '' }}

      - name: Build and push harnx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/harnx.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dobesv/harnx:${{ steps.version.outputs.version }}
            ${{ needs.release.outputs.rc == 'false' && 'ghcr.io/dobesv/harnx:latest' || '' }}

  publish-crate:
    name: Publish to crates.io
    # Disabled: not yet ready to publish to crates.io. Re-enable by restoring
    # the original condition: `${{ needs.release.outputs.rc == 'false' }}`.
    if: false
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
