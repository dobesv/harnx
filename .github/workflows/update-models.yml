name: Update Models

on:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch: {}

concurrency:
  group: update-models
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-models:
    name: Update models.yaml
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Python unit tests
        run: python scripts/test_update_models.py

      - name: Run update script
        id: update
        run: |
          python scripts/update_models.py > /tmp/update-summary.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/update-summary.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/update-summary.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Validate YAML parses correctly
        run: python -c "import yaml; yaml.safe_load(open('crates/harnx/models.yaml'))"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate Rust build
        run: cargo build --workspace
        env:
          RUSTFLAGS: --deny warnings

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet crates/harnx/models.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update models.yaml from LiteLLM registry"
          title: "chore: update models.yaml from LiteLLM registry"
          body: |
            Automated update of `crates/harnx/models.yaml` from [LiteLLM model registry](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).

            ## Changes

            ${{ steps.update.outputs.summary }}

            ---
            *This PR was automatically generated by the [Update Models](.github/workflows/update-models.yml) workflow.*
          branch: chore/update-models
          delete-branch: true
          labels: automated,models,automerge
