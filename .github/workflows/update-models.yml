name: Update Models

on:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch: {}

concurrency:
  group: update-models
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-models:
    name: Update models.yaml
    runs-on: ubuntu-latest

    # The pull request is opened with a release-bot App token below, so the
    # workflow's own token only needs to read the checkout.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Python unit tests
        run: python scripts/test_update_models.py

      - name: Run update script
        id: update
        run: |
          python scripts/update_models.py > /tmp/update-summary.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/update-summary.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/update-summary.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Validate YAML parses correctly
        run: python -c "import yaml; yaml.safe_load(open('crates/harnx/models.yaml'))"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate Rust build
        run: cargo build --workspace
        env:
          RUSTFLAGS: --deny warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # This PR is auto-merge labelled, so the patch guard has to run here and
      # not only in the PR's own CI.
      - name: Validate shipped request patches
        run: cargo nextest run -p harnx-client --test models_yaml_patches
        env:
          RUSTFLAGS: --deny warnings

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet crates/harnx/models.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # A pull request opened with the workflow's own GITHUB_TOKEN gets its
      # `pull_request` workflow runs parked as "action required", so CI never
      # started until a maintainer clicked "Approve and run" and Mergify had
      # nothing green to queue. Opening it as the release-bot App instead (the
      # same App release-prepare.yaml pushes with) makes it an ordinary
      # bot-authored pull request: CI runs on its own and the `automerge`
      # label lets Mergify merge it once the required checks pass. The token
      # is scoped down to the two permissions the create-pull-request step
      # actually uses.
      - name: Mint release-bot token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The bot's noreply address needs its *user* id, which differs from the
      # installation id the token action exposes. Look it up so the commits
      # are attributed to the bot account rather than to whoever last edited
      # this workflow (the default `github.actor` on a scheduled run).
      - name: Look up release-bot user id
        if: steps.changes.outputs.changed == 'true'
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug='${{ steps.app-token.outputs.app-slug }}'
          user_id="$(gh api "/users/${slug}[bot]" --jq .id)"
          echo "identity=${slug}[bot] <${user_id}+${slug}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.bot-user.outputs.identity }}
          committer: ${{ steps.bot-user.outputs.identity }}
          commit-message: "chore: update models.yaml from LiteLLM registry"
          title: "chore: update models.yaml from LiteLLM registry"
          body: |
            Automated update of `crates/harnx/models.yaml` from [LiteLLM model registry](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).

            ## Changes

            ${{ steps.update.outputs.summary }}

            ---
            *This PR was automatically generated by the [Update Models](.github/workflows/update-models.yml) workflow.*
          branch: chore/update-models
          delete-branch: true
          labels: automated,models,automerge
