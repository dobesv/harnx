name: Web E2E

# NOTE: This workflow is intended to be NON-REQUIRED in branch protection.
# Do not add this status check as a required check in GitHub branch protection rules.
# This allows e2e failures to be reviewed without blocking PRs.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
