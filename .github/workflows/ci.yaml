name: CI

on:
  pull_request:
    branches:
    - '*'
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main

defaults:
  run:
    shell: bash

jobs:
  # CI is a required merge gate (see .mergify.yml), so the `All (<os>)` checks
  # must always post a conclusion. A workflow-level `paths:` filter would skip
  # the workflow and hang the merge queue; instead the steps below are gated on
  # this job, and a change with no Rust impact reports success in seconds. The
  # exclusions are paths no build step or test reads: `packages/` and
  # `example_config/` are embedded or read by Rust tests, so they stay in.
  # The first path rule in .config/affected.toml mirrors this list.
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter Rust-affecting paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!web/**'
              - '!docs/**'
              - '!.changeset/**'
              - '!scripts/check_changesets.py'
              - '!scripts/test_check_changesets.py'
              - '!demos/**'
              - '!docker/**'
              - '!*.md'
              - '!**/README.md'
              - '!**/CHANGELOG.md'
              - '!LICENSE-*'
              - '!renovate.json'
              - '!knope.toml'
              - '!.mergify.yml'
              - '!.github/workflows/web-ci.yml'
              - '!.github/workflows/web-e2e.yml'
              - '!.github/workflows/update-models.yml'
              - '!.github/workflows/release.yaml'
              - '!.github/workflows/release-prepare.yaml'
              - '!.github/workflows/publish-packages.yaml'

  all:
    name: All
    needs: changes

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: --deny warnings
      # Insta: update snapshots instead of failing (for PR review)
      # Set to "no" for actual CI, developers can use "yes" locally
      INSTA_UPDATE: "no"

    steps:
    - name: Skip notice
      if: needs.changes.outputs.rust != 'true'
      run: echo "No Rust-affecting changes detected — skipping build and tests and reporting success."

    - uses: actions/checkout@v7
      if: needs.changes.outputs.rust == 'true'
      with:
        # A pull_request run checks out the PR merged into its base; the
        # second commit is that base, which `cargo xtask affected` diffs against.
        fetch-depth: 2

    - name: Install Rust Toolchain Components
      if: needs.changes.outputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      if: needs.changes.outputs.rust == 'true'

    - name: Install cargo-nextest
      if: needs.changes.outputs.rust == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # Pull requests test only the packages their change can affect (see
    # .config/affected.toml). The merge queue and main always run everything,
    # so a missing edge in that file cannot let a break reach main. Each OS
    # computes its own list because target-specific dependencies differ.
    - name: Select affected packages
      id: affected
      if: needs.changes.outputs.rust == 'true'
      run: |
        if [ "${{ github.event_name }}" = pull_request ]; then
          args="$(cargo xtask affected --base HEAD^1)"
        else
          args="--workspace"
        fi
        echo "Testing: ${args:-nothing}"
        echo "args=${args}" >> "${GITHUB_OUTPUT}"

    # Tests spawn sibling bins by path (the worker, tool servers,
    # harnx-mcp-repro249, ...) from crates they don't depend on, so testing a
    # subset of packages still needs every bin. Tests themselves are built by
    # nextest for just the selected packages; building bins first causes no
    # rebuild because the feature sets match.
    - name: Build workspace binaries
      if: needs.changes.outputs.rust == 'true'
      run: cargo build --workspace --bins

    - name: Install nats-server (Linux)
      if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
      run: |
        set -euo pipefail
        VERSION="v2.11.6"
        ASSET="nats-server-${VERSION}-linux-amd64.tar.gz"
        # Pinned digest for the pinned VERSION. GitHub releases are mutable, so
        # the tag alone does not pin the bytes, and the release's own SHA256SUMS
        # is served from the same place as the tarball — fetching it would prove
        # nothing an attacker who can replace one can't also replace.
        SHA256="5e5272dd1bdb8da020aedc8cf883fb26c128441809a992f156e0b1ccb28ac5b7"
        DOWNLOAD_URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${ASSET}"
        BINDIR="${HOME}/.local/bin"
        mkdir -p "${BINDIR}"
        TMPDIR_DL="$(mktemp -d)"
        # Download to a file rather than piping into tar. A retry can't resume a
        # stream tar has already started reading, and an HTTP error body piped to
        # tar surfaces as "tar: Error is not recoverable" instead of naming the
        # failed download.
        curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 2 \
          --location --silent --show-error --fail --output "${TMPDIR_DL}/${ASSET}" "${DOWNLOAD_URL}"
        echo "${SHA256}  ${TMPDIR_DL}/${ASSET}" | shasum -a 256 --check --status \
          || { echo "::error::nats-server checksum mismatch for ${ASSET}"; exit 1; }
        tar -xzf "${TMPDIR_DL}/${ASSET}" -C "${BINDIR}" --strip-components=1 "nats-server-${VERSION}-linux-amd64/nats-server"
        chmod +x "${BINDIR}/nats-server"
        echo "${BINDIR}" >> "${GITHUB_PATH}"
      shell: bash

    # Local execution routes through a shared nats-server, so the one-shot / TUI
    # e2e tests need the binary on every OS (they skip cleanly if it is absent,
    # but we want real coverage here).
    - name: Install nats-server (macOS)
      if: needs.changes.outputs.rust == 'true' && runner.os == 'macOS'
      run: |
        set -euo pipefail
        VERSION="v2.11.6"
        ARCH="$(uname -m)"
        # See the Linux step for why the digests are pinned here rather than fetched.
        case "${ARCH}" in
          arm64)
            NATS_ARCH="arm64"
            SHA256="1a78170526e18a41ca2a24e6eaa00e95d39c677e1d5bfc56d3f662a114324e17"
            ;;
          x86_64)
            NATS_ARCH="amd64"
            SHA256="6c8f0cf8bc879db372ce0edca34c0178845e92286fac47db1a6a0f5eff59daef"
            ;;
          *) echo "unsupported macOS arch: ${ARCH}" >&2; exit 1 ;;
        esac
        ASSET="nats-server-${VERSION}-darwin-${NATS_ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${ASSET}"
        BINDIR="${HOME}/.local/bin"
        mkdir -p "${BINDIR}"
        TMPDIR_DL="$(mktemp -d)"
        # See the Linux step for why this downloads to a file first.
        curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 2 \
          --location --silent --show-error --fail --output "${TMPDIR_DL}/${ASSET}" "${DOWNLOAD_URL}"
        echo "${SHA256}  ${TMPDIR_DL}/${ASSET}" | shasum -a 256 --check --status \
          || { echo "::error::nats-server checksum mismatch for ${ASSET}"; exit 1; }
        tar -xzf "${TMPDIR_DL}/${ASSET}" -C "${BINDIR}" --strip-components=1 "nats-server-${VERSION}-darwin-${NATS_ARCH}/nats-server"
        chmod +x "${BINDIR}/nats-server"
        echo "${BINDIR}" >> "${GITHUB_PATH}"
      shell: bash

    - name: Install nats-server (Windows)
      if: needs.changes.outputs.rust == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = 'v2.11.6'
        $asset = "nats-server-$version-windows-amd64.zip"
        $sha256 = '947aea642cc2b7b688a11a71c36c80a030cabb109167246ca1f8fbf30dc1c83b'
        $downloadUrl = "https://github.com/nats-io/nats-server/releases/download/$version/$asset"
        $downloadDir = Join-Path $env:RUNNER_TEMP 'nats-server-download'
        $binDir = Join-Path $env:RUNNER_TEMP 'nats-server-bin'
        New-Item -ItemType Directory -Force -Path $downloadDir, $binDir | Out-Null
        $archive = Join-Path $downloadDir $asset
        Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
        $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $sha256) {
          throw "nats-server checksum mismatch for $asset"
        }
        Expand-Archive -Path $archive -DestinationPath $downloadDir -Force
        $source = Join-Path $downloadDir "nats-server-$version-windows-amd64/nats-server.exe"
        Copy-Item $source (Join-Path $binDir 'nats-server.exe')
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $binDir 'nats-server.exe') --version
        if ($LASTEXITCODE -ne 0) {
          throw "nats-server.exe --version failed with exit code $LASTEXITCODE"
        }

    - name: Test
      # Use the `ci` nextest profile (.config/nextest.toml): retries transient
      # timing flakes from the broker/worker/e2e tests and reports all failures
      # per run (fail-fast = false) instead of aborting on the first.
      if: needs.changes.outputs.rust == 'true' && steps.affected.outputs.args != ''
      run: cargo nextest run ${{ steps.affected.outputs.args }} --profile ci

    - name: Check for pending snapshot updates
      if: needs.changes.outputs.rust == 'true' && failure()
      run: |
        if ls crates/harnx-tui/src/snapshots/*.snap.new 2>/dev/null; then
          echo "::error::Snapshot updates pending. Run 'cargo insta review' locally to review and accept changes."
          exit 1
        fi

    # Lints are platform-agnostic, so one runner is enough. The per-OS `Build
    # workspace` step still compiles with `--deny warnings`, which catches rustc
    # warnings in platform-gated code that Linux clippy never sees.
    - name: Clippy
      if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
      run: cargo clippy --all --all-targets -- -D warnings

    - name: Format
      if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
      run: cargo fmt --all --check

  docker-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check harnx-plans-tools Dockerfile
        run: docker buildx build --check -f docker/harnx-plans-tools.Dockerfile .

      - name: Check harnx Dockerfile
        run: docker buildx build --check -f docker/harnx.Dockerfile .

  # knope skips or deletes a malformed changeset without a warning, so the
  # mistake would otherwise surface only as a changelog entry missing from a
  # release. scripts/check_changesets.py lists the cases.
  changesets:
    name: Check changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the changeset checker
        run: python3 scripts/test_check_changesets.py

      - name: Check changesets
        run: python3 scripts/check_changesets.py
