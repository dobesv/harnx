name: CI

on:
  pull_request:
    branches:
    - '*'
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main

# A new push to a pull request cancels the run for the push before it, which
# would otherwise keep holding runners, macOS ones especially, until it
# finished. Other events each get a group of their own, so nothing on main or
# in the merge queue is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # CI is a required merge gate (see .mergify.yml), so the `All (<os>)` checks
  # must always post a conclusion. A workflow-level `paths:` filter would skip
  # the workflow and hang the merge queue; instead the jobs below are gated on
  # this job, and a change with no Rust impact reports success in seconds. The
  # exclusions are paths no build step or test reads: packages, example_config,
  # and middleware examples in docs/demos are read by Rust tests, so they stay in.
  # The first path rule in .config/affected.toml mirrors this list.
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter Rust-affecting paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!web/**'
              - '!.changeset/**'
              - '!scripts/check_changesets.py'
              - '!scripts/test_check_changesets.py'
              - '!docker/**'
              - '!*.md'
              - '!**/README.md'
              - '!**/CHANGELOG.md'
              - '!LICENSE-*'
              - '!renovate.json'
              - '!knope.toml'
              - '!rustqual.toml'
              - '!.mergify.yml'
              - '!.github/workflows/web-ci.yml'
              - '!.github/workflows/web-e2e.yml'
              - '!.github/workflows/update-models.yml'
              - '!.github/workflows/release.yaml'
              - '!.github/workflows/release-prepare.yaml'
              - '!.github/workflows/publish-packages.yaml'

  # Each OS builds once and splits its tests between several jobs
  # (ci-rust.yaml). The partition counts keep each OS near the same wall time:
  # the full suite's tests add up to about 50 minutes on Linux and Windows,
  # whose runners have 4 CPUs, and 77 on macOS, whose runners have 3. GitHub's
  # free plan runs at most 5 macOS jobs at once across the account, so more
  # macOS partitions mostly queue behind each other.
  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yaml
    with:
      os: ubuntu-latest
      partitions: '[1, 2]'

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yaml
    with:
      os: macos-latest
      partitions: '[1, 2, 3]'

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yaml
    with:
      os: windows-latest
      partitions: '[1, 2]'

  # Lints are platform-agnostic, so one runner is enough. Each OS's build
  # still compiles with `--deny warnings`, which catches rustc warnings in
  # platform-gated code that Linux clippy never sees. A job of its own keeps
  # clippy's compile off the path to the Linux tests.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable

    # See ci-rust.yaml for why only main saves.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    - name: Clippy
      run: cargo clippy --all --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all --check

  # The checks .mergify.yml and the main branch ruleset require. Each one
  # passes when `changes` passed and either nothing Rust-affecting changed or
  # its OS's workflow says it passed. They check that output rather than the
  # call's result, which looked like a pass when GitHub cancelled a macOS
  # build that no runner picked up.
  all-linux:
    name: All (ubuntu-latest)
    needs: [changes, linux, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require the Linux jobs to pass
      if: needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && needs.linux.outputs.passed != 'true') || (needs.changes.outputs.rust == 'true' && needs.lint.result != 'success')
      run: exit 1

  all-macos:
    name: All (macos-latest)
    needs: [changes, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require the macOS jobs to pass
      if: needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && needs.macos.outputs.passed != 'true')
      run: exit 1

  all-windows:
    name: All (windows-latest)
    needs: [changes, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require the Windows jobs to pass
      if: needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && needs.windows.outputs.passed != 'true')
      run: exit 1

  # Fails a pull request that adds rustqual findings or makes existing ones
  # worse (`cargo xtask quality`; AGENTS.md, "Code quality gate"). It is
  # advisory: .mergify.yml doesn't require it. A change to rustqual.toml alone
  # skips it, because both sides of the comparison use the new settings.
  quality:
    name: Code quality
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # As in ci-rust.yaml: the second commit is the pull request's base.
          fetch-depth: 2
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # The pinned rustqual isn't a workspace member and builds into a target
      # directory of its own (xtask/rustqual/Cargo.toml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            xtask/rustqual -> target/rustqual

      - name: Compare rustqual findings with the base
        run: cargo xtask quality --base HEAD^1

  docker-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check harnx-plans-tools Dockerfile
        run: docker buildx build --check -f docker/harnx-plans-tools.Dockerfile .

      - name: Check harnx Dockerfile
        run: docker buildx build --check -f docker/harnx.Dockerfile .

  # knope skips or deletes a malformed changeset without a warning, so the
  # mistake would otherwise surface only as a changelog entry missing from a
  # release. scripts/check_changesets.py lists the cases.
  changesets:
    name: Check changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the changeset checker
        run: python3 scripts/test_check_changesets.py

      - name: Check changesets
        run: python3 scripts/check_changesets.py
