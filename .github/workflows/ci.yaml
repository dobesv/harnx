name: CI

on:
  pull_request:
    branches:
    - '*'
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main

defaults:
  run:
    shell: bash

jobs:
  all:
    name: All

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: --deny warnings
      # Insta: update snapshots instead of failing (for PR review)
      # Set to "no" for actual CI, developers can use "yes" locally
      INSTA_UPDATE: "no"

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # harnx's integration tests (tests/interrupt_e2e.rs, tests/tmux_e2e.rs)
    # spawn sibling bins (harnx-mcp-time, harnx-mcp-repro249) via a
    # sibling-path lookup in src/test_utils/interrupt.rs. Those bins live in
    # separate workspace crates that harnx doesn't depend on, so
    # `cargo nextest run --all` alone won't build them. Build the whole
    # workspace (bins + tests) first so every bin is present before tests
    # start.
    - name: Build workspace
      run: cargo build --workspace --all-targets

    - name: Install nats-server (Linux)
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        VERSION="v2.11.6"
        ASSET="nats-server-${VERSION}-linux-amd64.tar.gz"
        DOWNLOAD_URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${ASSET}"
        BINDIR="${HOME}/.local/bin"
        mkdir -p "${BINDIR}"
        curl -sL "${DOWNLOAD_URL}" | tar -xzf - -C "${BINDIR}" --strip-components=1 "nats-server-${VERSION}-linux-amd64/nats-server"
        chmod +x "${BINDIR}/nats-server"
        echo "${BINDIR}" >> "${GITHUB_PATH}"
      shell: bash

    # Local execution routes through a shared nats-server, so the one-shot / TUI
    # e2e tests need the binary on every OS (they skip cleanly if it is absent,
    # but we want real coverage here).
    - name: Install nats-server (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        VERSION="v2.11.6"
        ARCH="$(uname -m)"
        case "${ARCH}" in
          arm64) NATS_ARCH="arm64" ;;
          x86_64) NATS_ARCH="amd64" ;;
          *) echo "unsupported macOS arch: ${ARCH}" >&2; exit 1 ;;
        esac
        ASSET="nats-server-${VERSION}-darwin-${NATS_ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${ASSET}"
        BINDIR="${HOME}/.local/bin"
        mkdir -p "${BINDIR}"
        curl -sL "${DOWNLOAD_URL}" | tar -xzf - -C "${BINDIR}" --strip-components=1 "nats-server-${VERSION}-darwin-${NATS_ARCH}/nats-server"
        chmod +x "${BINDIR}/nats-server"
        echo "${BINDIR}" >> "${GITHUB_PATH}"
      shell: bash

    # NOTE: nats-server is intentionally NOT installed on Windows. The
    # shared-broker + worker-subprocess machinery (and the NATS worker
    # integration tests) is Unix-first; on Windows those integration tests hang
    # on the JetStream/worker path. Without the binary they skip cleanly (each
    # guards on nats-server availability), matching the pre-existing behavior
    # where Windows CI never exercised the NATS path. Linux + macOS get full
    # coverage. Revisit if/when the worker path gains first-class Windows support.

    - name: Test
      # Use the `ci` nextest profile (.config/nextest.toml): retries transient
      # timing flakes from the broker/worker/e2e tests and reports all failures
      # per run (fail-fast = false) instead of aborting on the first.
      run: cargo nextest run --all --profile ci

    - name: Check for pending snapshot updates
      if: failure()
      run: |
        if ls crates/harnx-tui/src/snapshots/*.snap.new 2>/dev/null; then
          echo "::error::Snapshot updates pending. Run 'cargo insta review' locally to review and accept changes."
          exit 1
        fi

    - name: Clippy
      run: cargo clippy --all --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all --check

  docker-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check harnx-mcp-time Dockerfile
        run: docker buildx build --check -f docker/harnx-mcp-time.Dockerfile .

      - name: Check harnx-mcp-plans Dockerfile
        run: docker buildx build --check -f docker/harnx-mcp-plans.Dockerfile .

      - name: Check harnx Dockerfile
        run: docker buildx build --check -f docker/harnx.Dockerfile .