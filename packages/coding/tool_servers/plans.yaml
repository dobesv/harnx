command: harnx-mcp-bridge
description: >-
  File-based plan/task/note management (MCP→NATS bridge) — used by orchestrator
  agents to track multi-step work across sessions.
bin_override_env: HARNX_MCP_BRIDGE_BIN
args:
  - --name
  - plans
  - --
  - harnx-mcp-plans
  - --mcp-stdio
  - --dir
  - .agent/plans
