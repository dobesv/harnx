command: harnx-bash-tools
description: Shell execution — lets agents run commands and scripts

# Runs as a native toolset server. The co-located proxy-auth hook injects
# GitHub/Atlassian credentials before exec/spawn calls. Filesystem access is
# deny-all unless enabled by an opt-in batch or an explicit --allow-* argument.
# These batches provide system commands and temp space, development toolchains,
# and the current repository. See docs/bash-mcp-server.md and
# docs/migration-allowlist.md.

hooks:
  entries:
    - command: >-
        harnx-proxy-auth
        --hook 'if .host == "github.com" and (env.GITHUB_TOKEN // env.GH_TOKEN) != null then .headers.authorization = "Basic \(["x-access-token", (env.GITHUB_TOKEN // env.GH_TOKEN)] | join(":") | @base64)" end'
        --hook 'if (.host == "api.github.com" or .host == "uploads.github.com" or .host == "objects.githubusercontent.com") and (env.GITHUB_TOKEN // env.GH_TOKEN) != null then .headers.authorization = "Bearer \(env.GITHUB_TOKEN // env.GH_TOKEN)" end'
        --fs '{"harnx-fs-acli/acli/.keep": ""}'
        --env '{"ACLI_CONFIG_DIR": "\($temp_file_root)/harnx-fs-acli"}'
        --hook "$HARNX_PACKAGE_DIR/hooks/jira-auth-hook.py"

args:
  - --allow-common-default
  - --allow-dev-tools
  - --allow-repo-work
  # Custom paths outside the batches
  - --allow-write
  - ~/.config/chromium
  - --allow-read
  - ~/.config/dcg
  - --allow-read
  - ~/.config/git
  - --allow-read
  - ~/.config/rtk
  - --allow-rwx
  - ~/.ruff_cache
  # Upgrade ~/.cache from dev-tools read+write to read+write+exec (needed by some
  # build tools that run executables out of the cache directory)
  - --allow-rwx
  - ~/.cache
  - --allow-exec
  - /opt/google/chrome
  # Disable interactive editor
  - --env
  - EDITOR=true
  # Tell puppeteer not to use sandbox
  - --env
  - PUPPETEER_NO_SANDBOX=1
