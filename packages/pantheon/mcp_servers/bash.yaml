command: harnx-mcp-bash
description: Shell execution — lets agents run commands and scripts

# Restricts the bash sandbox to the current working directory.
# To allow access to additional paths, shadow this file with your own copy at
# ~/.config/harnx/mcp_servers/bash.yaml and add entries to roots: / args:
roots:
  - "."

args:
  # Allow access to asdf installed binaries
  - --extra-exec
  - ~/.asdf
  - --extra-read
  - ~/.tool-versions
  - --extra-read
  - ~/dev_cert
  # Allow access to bun binaries and cache
  - --extra-exec
  - ~/.bun
  - --extra-rwx
  - ~/.bun/install/cache
  # Allow access to various caches
  - --extra-rwx
  - ~/.cache
  # Allow access to various config files
  - --extra-read
  - ~/.config/acli
  - --extra-write
  - ~/.config/chromium
  - --extra-read
  - ~/.config/dcg
  - --extra-read
  - ~/.config/git
  - --extra-rwx
  - ~/.config/go
  - --extra-read
  - ~/.config/rtk
  # Git config
  - --extra-read
  - ~/.gitconfig
  - --extra-read
  - ~/.gitignore
  - --extra-read
  - ~/.gitignore_global
  # Allow access to user-local binaries
  - --extra-exec
  - ~/.local/bin
  # Allow access to mono
  - --extra-rwx
  - ~/.mono
  # Allow access to npm config and cache
  - --extra-rwx
  - ~/.npm
  # Allow access to npm config and cache
  - --extra-rwx
  - ~/.nvm
  - --extra-rwx
  - ~/.ruff_cache
  - --extra-exec
  - ~/.rustup
  # Allow cargo registry proc-macro .so files to be dlopen'd by rustc
  - --extra-exec
  - ~/.cargo
  - --extra-rwx
  - ~/.yarn
  # Allow access to google chrome binaries
  - --extra-exec
  - /opt/google/chrome
  # Disable interactive editor
  - --env
  - "EDITOR=true"
  # Tell puppeteer not to use sandbox
  - --env
  - "PUPPETEER_NO_SANDBOX=1"

hooks:
  entries:
  # Inject auth headers for GitHub and Atlassian (acli/Jira/Confluence) via MITM proxy.
  # Filters are conditional — if the env var is unset the header is not injected,
  # so this hook is safe to include even if you only use one service.
  # See docs/hooks-guide.md for setup instructions.
  - event: PreToolUse
    type: claude-command-persistent
    matcher: "exec|spawn"
    command: >-
      harnx-proxy-auth
      --hook 'if (.host == "github.com" or .host == "api.github.com" or .host == "uploads.github.com" or .host == "objects.githubusercontent.com") and (env.GITHUB_TOKEN // env.GH_TOKEN) != null
          then .headers.authorization = "Bearer \(env.GITHUB_TOKEN // env.GH_TOKEN)"
          end'
      --hook 'if (.host | endswith(".atlassian.net")) and env.ATLASSIAN_API_TOKEN != null
          then .headers.authorization = "Basic \([(env.ATLASSIAN_EMAIL // ""), (env.ATLASSIAN_API_TOKEN // "")] | join(":") | @base64)"
          end'
