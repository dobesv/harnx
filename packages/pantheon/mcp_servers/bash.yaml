command: harnx-mcp-bash
description: Shell execution — lets agents run commands and scripts

# Restricts the bash sandbox to the current working directory.
# To allow access to additional paths, shadow this file with your own copy at
# ~/.config/harnx/mcp_servers/bash.yaml and add entries to roots: / args:
roots:
  - "."

# NOTE: Many home-directory paths are already whitelisted by default and do NOT
# need to be added here. See docs/bash-mcp-server.md for the full list, which
# includes: ~/.gitconfig, ~/.gitignore, ~/.gitignore_global, ~/.tool-versions
# (read), ~/.local/bin, ~/.local/lib, ~/.bun, ~/.asdf, ~/go/bin, ~/.cargo
# (read+exec), ~/.cache, ~/go/pkg (read+write), ~/.npm, ~/.yarn, ~/.nvm,
# ~/.cargo/bin, ~/.cargo/registry, ~/.cargo/git, ~/.mono, ~/.bun/install/cache,
# ~/.pyenv, ~/.rye (read+write+exec).

args:
  # Allow access to detected project root (when run in a subdirectory) and git metadata (when in a git worktree)
  - --extra-rwx
  - $GIT_ROOT
  - --extra-write
  - $GIT_COMMON_DIR
  - --extra-rwx
  - $NODE_PROJECT_ROOT
  - --extra-rwx
  - $CARGO_ROOT
  - --extra-rwx
  - $GO_ROOT
  # Allow access to various config files
  - --extra-write
  - ~/.config/chromium
  - --extra-read
  - ~/.config/dcg
  - --extra-read
  - ~/.config/git
  - --extra-rwx
  - ~/.config/go
  - --extra-read
  - ~/.config/rtk
  # Allow access to ruff's cache
  - --extra-rwx
  - ~/.ruff_cache
  # Allow access to rustup-managed toolchains
  - --extra-exec
  - ~/.rustup
  # Upgrade ~/.cache from default read+write to read+write+exec (needed by some
  # build tools that run executables out of the cache directory)
  - --extra-rwx
  - ~/.cache
  # Allow access to google chrome binaries
  - --extra-exec
  - /opt/google/chrome
  # Disable interactive editor
  - --env
  - "EDITOR=true"
  # Tell puppeteer not to use sandbox
  - --env
  - "PUPPETEER_NO_SANDBOX=1"

hooks:
  entries:
  # Inject auth headers for GitHub and Atlassian (acli/Jira/Confluence) via MITM proxy.
  # GitHub filters are conditional — if the token env var is unset the header is
  # not injected. The Atlassian side is handled by the bundled hooks/jira-auth-hook.py
  # (referenced via $HARNX_PACKAGE_DIR, the package directory): it reads the host
  # acli profile + keyring token and rewrites auth for *.atlassian.com. If acli is
  # not set up it degrades to pass-through, so this hook is safe even if you only
  # use one service. See docs/hooks-guide.md for setup instructions.
  - event: PreToolUse
    type: claude-command-persistent
    matcher: "exec|spawn"
    # NOTE: this is a folded (>-) scalar, so line breaks become spaces and the
    # whole thing is ONE shell command. Every continuation line MUST stay at
    # this same indent — a more-indented line would be kept as a literal newline,
    # which `sh -c` treats as a command separator, silently dropping every
    # argument after it. Keep jq `then`/`end` aligned with `--hook`.
    #
    # ACLI_CONFIG_DIR must point the sandboxed acli at the SAME directory the
    # jira-auth-hook.py writes its synthetic config into. Both sides key off
    # $temp_file_root — proxy-auth's own per-run temp dir, which is unique per
    # proxy instance and auto-deleted when the proxy exits (so two proxies never
    # collide and nothing is left behind). --fs is what allocates that temp dir
    # (and creates the harnx-fs-acli/acli/ folder); --env hands its path to the
    # sandbox as ACLI_CONFIG_DIR; and proxy-auth sends the same $temp_file_root
    # to the hook in each request's `vars`, so the hook writes its config there.
    command: >-
      harnx-proxy-auth
      --hook 'if .host == "github.com" and (env.GITHUB_TOKEN // env.GH_TOKEN) != null
      then .headers.authorization = "Basic \(["x-access-token", (env.GITHUB_TOKEN // env.GH_TOKEN)] | join(":") | @base64)"
      end'
      --hook 'if (.host == "api.github.com" or .host == "uploads.github.com" or .host == "objects.githubusercontent.com") and (env.GITHUB_TOKEN // env.GH_TOKEN) != null
      then .headers.authorization = "Bearer \(env.GITHUB_TOKEN // env.GH_TOKEN)"
      end'
      --fs '{"harnx-fs-acli/acli/.keep": ""}'
      --env '{"ACLI_CONFIG_DIR": "\($temp_file_root)/harnx-fs-acli"}'
      --hook "$HARNX_PACKAGE_DIR/hooks/jira-auth-hook.py"
