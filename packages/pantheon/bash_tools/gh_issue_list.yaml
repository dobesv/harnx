name: gh_issue_list
description: Search and list GitHub issues
parameters:
  query: { type: string, required: true, description: "Search text" }
  repo:   { type: string, required: false, pattern: "^[\\w.-]+/[\\w.-]+$", description: "owner/repo" }
  state:  { type: string, required: false, enum: [open, closed, all], description: "Issue state" }
  limit:  { type: integer, required: false, min: 1, max: 100, description: "Max results" }
env: { GH_PAGER: "" }
sandbox:
  read: ["~/.config/gh"]
  env:  ["GH_TOKEN", "GITHUB_TOKEN"]
template: false
script: |
  set -euo pipefail
  gh issue list --search "$QUERY" ${REPO:+--repo "$REPO"} ${STATE:+--state "$STATE"} ${LIMIT:+--limit "$LIMIT"} --json number,title,state,labels,updatedAt
