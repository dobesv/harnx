name: gh_pr_view
description: View a GitHub pull request as JSON
parameters:
  number: { type: integer, required: true, description: "PR number" }
  repo:   { type: string, required: false, pattern: "^[\\w.-]+/[\\w.-]+$", description: "owner/repo" }
env: { GH_PAGER: "" }
template: false
script: |
  set -euo pipefail
  gh pr view "$NUMBER" ${REPO:+--repo "$REPO"} --json title,body,author,state,baseRefName,headRefName,reviews,url
