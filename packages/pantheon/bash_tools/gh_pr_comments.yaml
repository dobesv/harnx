name: gh_pr_comments
description: View discussion comments on a GitHub pull request
parameters:
  number: { type: integer, required: true, description: "PR number" }
  repo:   { type: string, required: false, pattern: "^[\\w.-]+/[\\w.-]+$", description: "owner/repo" }
env: { GH_PAGER: "" }
template: false
script: |
  set -euo pipefail
  gh pr view "$NUMBER" ${REPO:+--repo "$REPO"} --comments
