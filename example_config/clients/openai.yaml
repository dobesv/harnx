type: openai
# api_key: xxx   # or set OPENAI_API_KEY in .env
# api_base: https://api.openai.com/v1   # optional

# Use patches to apply jq expressions per API type.
# Each expression receives {url, headers, body} and returns the modified version.
# patches:
#   chat_completions:
#     - 'if (.body.model | startswith("gpt-5")) then .body.reasoning_effort = "high" else . end'
#   responses:
#     - '.body.store = true'  # Override default store:false; re-enables dashboard logging

# Note: gpt-5.6-*:high and gpt-5.6-*:max aliases route to /v1/responses with
# store:false default. store:false prevents dashboard logging, but OpenAI
# retains payloads ~30 days for abuse monitoring unless the account has ZDR
# (applies to both endpoints).
