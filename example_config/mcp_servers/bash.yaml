command: harnx-mcp-bash
roots:
  - "$HOME"
description: >-
  Allow the agent to run commands or script snippets
rename_tools:
  exec: Bash

# Sandbox configuration examples (uncomment as needed):
#
# NOTE: Many home-directory paths are already whitelisted by default and do NOT
# need to be added here. See docs/bash-mcp-server.md for the full list, which
# includes: ~/.gitconfig, ~/.gitignore, ~/.gitignore_global, ~/.tool-versions
# (read), ~/.local/bin, ~/.local/lib, ~/.bun, ~/.asdf, ~/go/bin, ~/.cargo
# (read+exec), ~/.cache, ~/go/pkg (read+write), ~/.npm, ~/.yarn, ~/.nvm,
# ~/.cargo/bin, ~/.cargo/registry, ~/.cargo/git, ~/.mono, ~/.bun/install/cache,
# ~/.pyenv, ~/.rye (read+write+exec).
#
args:
#   - --no-sandbox                                          # Disable sandboxing entirely
  # Allow access to rustup-managed toolchains
  - --extra-exec
  - ~/.rustup
  # Allow access to ruff's cache
  - --extra-rwx
  - ~/.ruff_cache
  # Allow access to various config files
  - --extra-read
  - ~/.config/acli
  - --extra-write
  - ~/.config/chromium
  - --extra-read
  - ~/.config/dcg
  - --extra-read
  - ~/.config/git
  - --extra-rwx
  - ~/.config/go
  - --extra-read
  - ~/.config/rtk
  # Allow access to codescene config/license
  - --extra-write
  - ~/.codescene
  # Disable interactive editor
  - --env
  - EDITOR=true
  # Passthrough GITHUB_TOKEN and GH_TOKEN so the agent can do remote git operations
  - --env
  - GITHUB_TOKEN
  - --env
  - GH_TOKEN
  - --env
  - CS_ACCESS_TOKEN
#   - --sandbox-run                                         # Override sandbox helper binary
#   - /opt/harnx/harnx-mcp-bash-sandbox-run
#   - --env                                                 # Allow git push over SSH
#   - SSH_AUTH_SOCK
#
# env:
#   HARNX_BASH_EXTRA_READABLE: /opt/sdk      # Extra readable path via environment
#   HARNX_BASH_EXTRA_EXEC: /opt/tools/bin    # Extra executable path via environment
#   HARNX_BASH_ENV_PASSTHROUGH: GITHUB_TOKEN,SSH_AUTH_SOCK  # Comma-separated list to pass through
# hooks:
#   entries:
#   - event: PreToolUse
#     type: claude-command
#     command: /path/to/my-bash-hook.sh
#     # matcher applies to the bare (server-side) tool name, e.g. "exec" not "bash_exec".
#     # This means renaming the server doesn't require updating hook matchers.
#     # matcher: "exec"
