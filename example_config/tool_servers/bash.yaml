command: harnx-bash-tools
description: >-
  Allow the agent to run commands or script snippets
# Filesystem access is deny-all unless enabled by an opt-in batch or explicit
# --allow-* argument. These batches provide system commands and temp space,
# development toolchains, and the current repository. See
# docs/bash-mcp-server.md and docs/migration-allowlist.md.
args:
  - --allow-common-default
  - --allow-dev-tools
  - --allow-repo-work
  # Custom paths outside the batches
  - --allow-rwx
  - ~/.ruff_cache
  - --allow-write
  - ~/.config/chromium
  - --allow-read
  - ~/.config/dcg
  - --allow-read
  - ~/.config/git
  - --allow-read
  - ~/.config/rtk
  - --allow-write
  - ~/.codescene
  # Disable interactive editor
  - --env
  - EDITOR=true
  # Passthrough GITHUB_TOKEN and GH_TOKEN so the agent can do remote git operations
  - --env
  - GITHUB_TOKEN
  - --env
  - GH_TOKEN
  - --env
  - CS_ACCESS_TOKEN
