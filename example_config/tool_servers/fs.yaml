command: harnx-fs-tools
description: >-
  Agent filesystem access
# Access is deny-all unless enabled by a batch or explicit path. repo-work
# allows the current repository; dev-tools allows toolchain configuration and
# caches. To allow other paths, use --allow-rwx /path or --allow-read /path.
args:
  - --allow-repo-work
  - --allow-dev-tools
