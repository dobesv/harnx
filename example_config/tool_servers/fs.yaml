command: harnx-fs-tools
description: >-
  Agent filesystem access
# Runs directly as a toolset server. --default-root-cwd binds access to the
# process CWD (the user's repo), keeping the $HOME guard. To allow other paths,
# shadow this file at ~/.config/harnx/tool_servers/fs.yaml and add --root /path
# in args.
args:
  - --default-root-cwd