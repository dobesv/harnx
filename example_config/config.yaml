# ---- llm ----
model: openai:gpt-4o             # Specify the LLM to use
stream: true

# ---- behavior ----
save_session: true
keybindings: emacs

# ---- tool-use ----
tool_use: true
use_tools: '*'
toolsets:
  fs_read_tools:
    - fs_read
    - fs_ls
    - fs_grep
    - fs_find
  fs_write_tools:
    - fs_write
    - fs_edit
    - fs_insert
    - fs_re_replace
    - fs_rollback_file

# ---- hooks ----
# hooks:
#   entries:
#   - event: PreToolUse
#     type: claude-command
#     matcher: "Bash"
#     command: "dcg"
#
# Example: Mutate tool input via hookSpecificOutput.toolInput
# This shows how a PreToolUse hook can inject environment variables into Bash calls.
#
# hooks:
#   entries:
#   - event: PreToolUse
#     type: claude-command
#     matcher: "Bash"
#     command: "/path/to/inject-env-hook.sh"
#
# The inject-env-hook.sh script would look like:
#   #!/usr/bin/env python3
#   import json, sys
#   data = json.load(sys.stdin)
#   # Mutate tool_input to add env vars
#   data["tool_input"]["env"] = {"MY_VAR": "secret-value"}
#   # Emit mutated input via hookSpecificOutput
#   json.dump({"hookSpecificOutput": {"toolInput": data["tool_input"]}}, sys.stdout)
#
# PreToolUse hooks can return hookSpecificOutput.toolInput to mutate tool arguments.
# PostToolUse hooks can return hookSpecificOutput.toolResponse to mutate the tool response.
# Example: Inject GitHub auth headers for HTTPS requests via the harnx-proxy-auth hook.
# This is a persistent hook process that acts as an HTTPS MITM proxy, injecting auth
# headers based on URL-matcher rules. It runs once and handles all bash_exec/bash_spawn events.
#
# hooks:
#   entries:
#   - event: PreToolUse
#     type: claude-command-persistent
#     matcher: "bash_exec|bash_spawn"
#     command: >-
#       harnx-proxy-auth
#       --hook 'if (.host == "github.com" or .host == "api.github.com" or .host == "uploads.github.com" or .host == "objects.githubusercontent.com")
#           then .headers.authorization = "Bearer \(env.GITHUB_TOKEN // env.GH_TOKEN)"
#           else . end'
