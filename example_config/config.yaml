# ---- llm ----
model: openai:gpt-4o             # Specify the LLM to use
stream: true

# ---- behavior ----
save_session: true
# Number of days of inactivity after which old sessions (transcript + attachments)
# are automatically deleted. Unset or 0 disables cleanup. Cleanup runs at startup
# and hourly in all modes. Activity is based on filesystem mtime.
cleanup_inactive_sessions_days: 14
keybindings: emacs

# ---- session titles ----
# Auto-generate a short, human-readable title for each session using an LLM.
# Titles appear in session listings and set the terminal / browser tab title.
# `title_agent` names an agent (see agents/example-title-agent.md); leave it
# unset to disable title generation. Point it at a small, fast chat model —
# NOT a reasoning model (o1/o3/DeepSeek-R1), which exhaust the token budget on
# internal reasoning and return empty/truncated titles.
title_agent: example-title-agent
# Regenerate the title after this many additional tokens of conversation
# (default 50000). The first title is generated on the first exchange. Set to 0
# to disable automatic generation entirely.
title_update_threshold: 50000

# ---- tool-use ----
tool_use: true
use_tools: '*'
toolsets:
  fs_read_tools:
    - fs_read
    - fs_ls
    - fs_grep
    - fs_find
  fs_write_tools:
    - fs_write
    - fs_edit
    - fs_insert
    - fs_re_replace
    - fs_rollback_file

# ---- hooks ----
# hooks:
#   entries:
#   - command: harnx-claude-compatible-hook-server --event PreToolUse --matcher "bash_exec|bash_spawn" -- dcg
#
# Example: Mutate tool input via hookSpecificOutput.toolInput
# This shows how a PreToolUse hook can inject environment variables into Bash calls.
#
# hooks:
#   entries:
#   - command: harnx-claude-compatible-hook-server --event PreToolUse --matcher "bash_exec|bash_spawn" -- /path/to/inject-env-hook.sh
#
# The inject-env-hook.sh script would look like:
#   #!/usr/bin/env python3
#   import json, sys
#   data = json.load(sys.stdin)
#   # Mutate tool_input to add env vars
#   data["tool_input"]["env"] = {"MY_VAR": "secret-value"}
#   # Emit mutated input via hookSpecificOutput
#   json.dump({"hookSpecificOutput": {"toolInput": data["tool_input"]}}, sys.stdout)
#
# PreToolUse hooks can return hookSpecificOutput.toolInput to mutate tool arguments.
# PostToolUse hooks can return hookSpecificOutput.toolResponse to mutate the tool response.
#
# ---- harnx-proxy-auth: credential injection via HTTPS MITM proxy ----
#
# harnx-proxy-auth intercepts outbound HTTPS requests and injects auth headers.
# It uses a sentinel technique: --env scripts inject fake placeholder tokens into
# the child bash environment (so the LLM never sees real credentials), then --hook
# filters match those sentinels in outgoing requests and replace them with real tokens.
#
# Available jaq helpers in --hook filters:
#   bearer(token)         =>  "Bearer <token>"
#   basic(user; password) =>  "Basic <base64(user:password)>"
#
# Available sentinel variables in --env and --hook scripts:
#   $fake_uuid_key        random UUID (matches typical API key format)
#   $fake_base64_key      random base64 string
#   $fake_url_base64_key  random URL-safe base64 string
#   $fake_hex_key         random 32-char hex string
#   $fake_email           random fake email address
#
# `if COND then EXPR end` — omitting `else` passes the input through unchanged when
# the condition is false (equivalent to `else .` in jaq but cleaner).
#
# Example: GitHub PAT auth injection (git over HTTPS + GitHub API + uploads)
#
# hooks:
#   entries:
#   - command: >-
#       harnx-proxy-auth
#       --env 'if env.GITHUB_TOKEN then .GITHUB_TOKEN = "ghp_\($fake_base64_key)" end'
#       --hook 'if .host == "github.com"
#               and .headers.authorization == basic("x-access-token"; "ghp_\($fake_base64_key)")
#           then .headers.authorization = basic("x-access-token"; env.GITHUB_TOKEN)
#           end'
#       --hook 'if (.host == "api.github.com" or .host == "uploads.github.com" or .host == "objects.githubusercontent.com")
#               and (.headers.authorization == bearer("ghp_\($fake_base64_key)")
#                    or .headers.authorization == "token ghp_\($fake_base64_key)")
#           then .headers.authorization = bearer(env.GITHUB_TOKEN)
#           end'
#
# The --env script injects a fake ghp_<sentinel> token into the sandbox so tools
# like `gh` see GITHUB_TOKEN set and consider themselves authenticated. The real
# token never enters the sandbox — harnx-proxy-auth reads it from the host env
# and injects it into outbound HTTP auth headers.
#
# Example: GitHub App auth injection (resident hook mints + caches installation token)
# Requires host env: GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, and either
# GITHUB_APP_INSTALLATION_ID or GITHUB_OWNER/GITHUB_REPO (or GITHUB_ORG).
# Optional scoping env vars:
#   GITHUB_APP_REPOSITORIES='["repo-one","repo-two"]'
#   GITHUB_APP_PERMISSIONS='{"contents":"read","pull_requests":"write"}'
# Optional test/advanced override: GITHUB_APP_INSTALLATION_TOKEN short-circuits
# live GitHub exchange and stays proxy-side only.
#
# hooks:
#   entries:
#   - command: >-
#       harnx-proxy-auth
#       --hook ./example_config/github-app-auth-hook.py
#       # Inline shebang script content also works.
#
# Example: Atlassian (Jira/Confluence) auth injection
# One resident hook handles whole acli workaround once: read host jira_config.yaml,
# select profile matching current_profile, fetch real token from host keyring, write
# private synthetic acli config with sentinel token, set ACLI_CONFIG_DIR, and swap in
# real Authorization header for *.atlassian.com gateway hosts (api./as./...) and the active site host.
#
# hooks:
#   entries:
#   - command: >-
#       harnx-proxy-auth
#       --fs '{"harnx-fs-acli/acli/.keep": ""}'
#       --env '{"ACLI_CONFIG_DIR": "\($temp_file_root)/harnx-fs-acli"}'
#       --hook ./example_config/jira-auth-hook.py
#
# NOTE: ACLI_CONFIG_DIR must resolve to the SAME directory jira-auth-hook.py
# writes into. Both sides key off $temp_file_root — proxy-auth's per-run temp
# dir, which is unique per instance and auto-deleted on exit. --fs allocates it
# (and creates the folder); --env hands the path to the sandbox; and proxy-auth
# sends the same $temp_file_root to the hook in each request's `vars`, so the
# hook writes its config there. ($temp_file_root is empty UNLESS --fs is passed.)
#
# Example: GCP auth injection for Node ADC / BigQuery-style clients
# Resident hook injects metadata endpoints into sandbox env, so Google client libs
# discover ADC without credential files. Sandbox gets only proxy metadata hints;
# proxy-side hook mints real token on demand and rewrites outbound Authorization
# on *.googleapis.com requests (for example BigQuery HTTPS) with real scoped token.
# Result: Node ADC works file-free, real Google credential stays outside sandbox,
# and sandbox cannot reuse token beyond proxied calls.
#
# Optional host env:
#   HARNX_GCP_TOKEN_CMD                      token source command
#     default: gcloud auth print-access-token
#   HARNX_GCP_SA                             service account for impersonation
#   HARNX_GCP_TOKEN_CMD='gcloud auth print-access-token --impersonate-service-account=$HARNX_GCP_SA'
#     use impersonation/scoping without exposing reusable Google credential in sandbox
#
# hooks:
#   entries:
#   - command: >-
#       harnx-proxy-auth
#       --env '{"GCE_METADATA_HOST":"127.0.0.1:\($proxy_port)","METADATA_SERVER_DETECTION":"assume-present"}'
#       # Optional: add GOOGLE_CLOUD_PROJECT in same --env object.
#       # --env '{"GCE_METADATA_HOST":"127.0.0.1:\($proxy_port)","METADATA_SERVER_DETECTION":"assume-present","GOOGLE_CLOUD_PROJECT":"<id>"}'
#       --hook ./example_config/gcp-auth-hook.py
#
# Both can be combined into a single harnx-proxy-auth invocation with multiple
# --env and --hook flags. See docs/sandbox-run.md for full claude-sb / gemini-sb
# wrapper script examples.
