# Nextest configuration.
#
# The `default` profile is used for local development: no retries, so a flake
# is visible immediately rather than being silently rescued.
#
# The `ci` profile is used by GitHub Actions (`cargo nextest run --profile ci`).
# Several integration tests spin up a real `nats-server` broker + worker
# subprocesses and the tmux/interrupt e2e tests drive a real terminal; these are
# inherently timing-sensitive and can flake on loaded/contended CI runners.
# `retries` gives transient timing flakes a bounded number of re-runs (a
# genuinely broken test still fails every attempt), and `fail-fast = false`
# surfaces *all* failures in a single run instead of aborting on the first —
# which makes diagnosing cross-platform failures far faster.

# scripts/nextest-sandbox needs NEXTEST_ATTEMPT_ID, which nextest 0.9.116 added.
nextest-version = "0.9.116"

[test-groups]
# Terminal-driving e2e tests contend for the same CPU/process-spawn resources.
heavy-e2e = { max-threads = 1 }
# Broker-backed tests each launch a NATS process and several async runtimes.
# Bound their aggregate process/thread load so one test's broker is not starved
# or killed when the workspace suite fans out on high-core-count runners.
broker-e2e = { max-threads = 8 }
# The same groups for local runs, where these caps set the wall time: at 1 and
# 8, the 16 heavy tests alone took the whole ~100s on a 24-core box. At 3 and
# 16 a full run takes ~58s, and 16 such runs had no failures. A cap above
# nextest's thread count (one per CPU) has no effect, so smaller machines get
# what they had. CI keeps the tighter groups on its 4-CPU runners.
heavy-e2e-local = { max-threads = 3 }
broker-e2e-local = { max-threads = 16 }

[profile.default]
retries = 0

[[profile.default.overrides]]
filter = 'test(/^tmux_e2e::/) | test(/^interrupt_e2e::/)'
test-group = 'heavy-e2e-local'

[[profile.default.overrides]]
filter = '(package(harnx-a2a-server) & test(/^(runner|unary|streaming|compat|e2e|store_nats)::/)) | binary(/nats/) | test(/^local_worker_supervisor::/) | test(/nats/) | test(/subagent_replay/) | test(/tool_confirmation/) | test(/nats_tool_provider/) | test(/bootstrap::handler::/) | test(/bootstrap::real_mcp::/)'
test-group = 'broker-e2e-local'

[profile.ci]
# Retry transient (timing/load-induced) flakes. A real failure fails all attempts.
retries = { backoff = "exponential", count = 3, delay = "2s", jitter = true }
# Run the whole suite so every failure is reported per run, not just the first.
fail-fast = false
# Report (not kill) slow tests early, but allow generous headroom for the
# broker/worker/e2e tests under CI load before terminating a truly hung test.
slow-timeout = { period = "60s", terminate-after = 4 }
# Keep CI output readable: show final status for retried/failed tests.
final-status-level = "flaky"

[[profile.ci.overrides]]
filter = 'test(/^tmux_e2e::/) | test(/^interrupt_e2e::/)'
test-group = 'heavy-e2e'

[[profile.ci.overrides]]
filter = '(package(harnx-a2a-server) & test(/^(runner|unary|streaming|compat|e2e|store_nats)::/)) | binary(/nats/) | test(/^local_worker_supervisor::/) | test(/nats/) | test(/subagent_replay/) | test(/tool_confirmation/) | test(/nats_tool_provider/) | test(/bootstrap::handler::/) | test(/bootstrap::real_mcp::/)'
test-group = 'broker-e2e'
