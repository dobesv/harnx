# Cargo configuration for the workspace: cross-compiling Windows targets from
# Linux, the linker for native Windows builds, the `xtask` alias and, at the
# end, the runner that puts every nextest test on Linux and macOS in the test
# sandbox (scripts/nextest-sandbox; AGENTS.md, "Test sandbox").
#
# Cross-compiling Windows targets from Linux needs (Ubuntu/Debian):
#   sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine-binfmt
#   rustup target add x86_64-pc-windows-gnu
#
# Wine binfmt_misc must be enabled so that .exe files are auto-run via wine.
# The wine-binfmt package usually handles this automatically.
#
# Usage:
#   cargo build --target x86_64-pc-windows-gnu
#   cargo test  --target x86_64-pc-windows-gnu
#   cargo clippy --target x86_64-pc-windows-gnu --all --all-targets -- -D warnings

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
runner = "wine"

# Link native Windows builds with the LLVM linker that ships in the Rust
# toolchain instead of MSVC's link.exe. Measured on a 4-CPU GitHub Windows
# runner, workspace units built 16% faster (integration-test binaries, which
# are almost all link time, 24%). Changing the linker rebuilds every crate once.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[alias]
xtask = "run --package xtask --"

# Every test nextest runs on Linux and macOS goes through the sandbox runner,
# which gives it a private environment (AGENTS.md, "Test sandbox"). Cargo
# resolves this path against the workspace root, and the script passes
# `cargo run`, `cargo test` and `cargo bench` through untouched.
[target.'cfg(any(target_os = "linux", target_os = "macos"))']
runner = "scripts/nextest-sandbox"
