queue_rules:
  - name: main
    batch_size: 5
    merge_method: squash
    checks_timeout: 15 m 30 s
    max_checks_retries: 5
    update_method: rebase
    batch_max_wait_time: 15 m 34 s
    batch_max_failure_resolution_attempts: 10
    # The batch is only merged once every required check is green. Keep the
    # main-branch GitHub ruleset's required checks synchronized with this list
    # so merges outside Mergify cannot bypass the same safety gates.
    merge_conditions:
      - check-success=All (ubuntu-latest)
      - check-success=All (macos-latest)
      - check-success=All (windows-latest)
      - check-success=Lint Dockerfiles
      # Web checks always run (on pull_request + merge_group) and report success
      # even when web/** is unchanged, so they are safe as required gates.
      # See .github/workflows/web-ci.yml and web-e2e.yml.
      - check-success=Web Build
      - check-success=Playwright E2E Tests

pull_request_rules:
  # Renovate applies this label only to non-major updates. Keeping merge
  # ownership here avoids racing Renovate's platform-native automerge against
  # the queue's full set of required checks.
  - name: Automerge PRs labeled automerge
    conditions:
      - label=automerge
    actions:
      queue:
        name: main
